name: Self-Healing MLOps CI/CD Release Pipeline

on:
  push:
    branches: [ master, main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master, main ]

env:
  PYTHON_VERSION: '3.10'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # Stage 1: Code Quality & Linting
  # ============================================================
  lint-and-typecheck:
    name: 1. Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black code format check
        run: |
          black --check src/ tests/

      - name: Run Flake8 linter
        run: |
          flake8 src/ tests/ --max-line-length=120 --exclude=venv,.venv,__pycache__

      - name: Run MyPy strict type checking
        run: |
          mypy src/

  # ============================================================
  # Stage 2: Unit Testing & Code Coverage
  # ============================================================
  unit-tests:
    name: 2. Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Execute Unit Test Suite
        env:
          TESTING: "true"
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage.xml

  # ============================================================
  # Stage 3: Integration Testing
  # ============================================================
  integration-tests:
    name: 3. Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Execute Integration Test Suite
        env:
          TESTING: "true"
        run: |
          pytest tests/integration/ -v

  # ============================================================
  # Stage 4: Model Validation & Schema Contract
  # ============================================================
  model-validation:
    name: 4. Model Validation & Schema Check
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Canonical Feature Schema
        run: |
          python -c "
          from src.features.schema import FEATURE_COLUMNS, validate_features
          import pandas as pd
          assert len(FEATURE_COLUMNS) == 10, 'Expected 10 canonical features'
          print('✅ Canonical feature schema validation passed')
          "

      - name: Verify Reference Dataset Integrity
        run: |
          python -c "
          from scripts.bootstrap_reference import verify_reference_integrity
          verify_reference_integrity('monitoring/reference')
          print('✅ Reference data integrity verified')
          "

  # ============================================================
  # Stage 5: Container Build & Security Scan
  # ============================================================
  docker-build-and-scan:
    name: 5. Container Build & Security Scan
    runs-on: ubuntu-latest
    needs: model-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image with Immutable SHA Tag
        run: |
          docker build \
            --tag self-healing-mlops-api:${{ github.sha }} \
            --tag self-healing-mlops-api:latest \
            --file Dockerfile .

      - name: Build Monitoring Image with Immutable SHA Tag
        run: |
          docker build \
            --tag self-healing-mlops-monitoring:${{ github.sha }} \
            --tag self-healing-mlops-monitoring:latest \
            --file Dockerfile.monitoring .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'self-healing-mlops-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================
  # Stage 6: Staging Deployment, Healthcheck & Smoke Tests
  # ============================================================
  staging-deployment:
    name: 6. Staging Deployment & Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build-and-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Staging .env Configuration
        run: |
          cat << 'EOF' > .env
          POSTGRES_HOST=postgres-mlops
          POSTGRES_PORT=5432
          MLOPS_DB_NAME=mlops
          POSTGRES_USER=mlops
          POSTGRES_PASSWORD=staging_mlops_pass_123
          AIRFLOW_DB_HOST=postgres
          AIRFLOW_DB_PORT=5432
          AIRFLOW_DB_NAME=airflow
          AIRFLOW_DB_USER=airflow
          AIRFLOW_DB_PASSWORD=staging_airflow_pass_123
          AIRFLOW_USERNAME=admin
          AIRFLOW_PASSWORD=admin
          AIRFLOW_EMAIL=admin@example.com
          AIRFLOW_WEBSERVER_HOST_PORT=8081
          AIRFLOW_SECRET_KEY=k9Yp3n7sQ8tBv2LxZ4mR0uF1wE6hC5aG
          AIRFLOW_FERNET_KEY=ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
          MLFLOW_TRACKING_URI=http://mlflow:5000
          MLFLOW_USERNAME=admin
          MLFLOW_PASSWORD=admin
          PGADMIN_EMAIL=admin@admin.com
          PGADMIN_PASSWORD=admin
          MONITORING_INTERVAL=300
          MONITORING_LOOKBACK=24
          EOF

      - name: Start Staging Database and MLflow Services
        run: |
          docker compose up -d --build postgres-mlops mlflow
          echo "Waiting for PostgreSQL and MLflow services to be healthy..."
          timeout 60 bash -c 'until docker compose ps | grep -E "mlops-postgres.*healthy" && docker compose ps | grep -E "mlflow-server.*healthy"; do sleep 3; done'

      - name: Bootstrap Database Schema & Staging Baseline Model
        run: |
          docker compose run --rm --no-deps -e MLFLOW_TRACKING_URI=http://mlflow:5000 -e POSTGRES_HOST=postgres-mlops -e POSTGRES_USER=mlops -e POSTGRES_PASSWORD=staging_mlops_pass_123 -e MLOPS_DB_NAME=mlops api python scripts/db/init_database.py
          docker compose run --rm --no-deps -e MLFLOW_TRACKING_URI=http://mlflow:5000 api python -m src.train_model_mlflow

      - name: Start Staging API Service
        run: |
          docker compose up -d --build api
          echo "Waiting for API service to be healthy..."
          timeout 60 bash -c 'until docker compose ps | grep -E "mlops-api.*healthy"; do sleep 3; done'

      - name: Execute Liveness Health Check (GET /health)
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health || (echo "Liveness check failed" && exit 1)

      - name: Execute Production Readiness Probe (GET /ready)
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/ready || (echo "Readiness probe failed" && exit 1)

      - name: Execute Inference Smoke Test (POST /predict)
        id: smoke_test
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "RevolvingUtilizationOfUnsecuredLines": 0.766,
              "age": 45,
              "NumberOfTime30_59DaysPastDueNotWorse": 2,
              "DebtRatio": 0.802,
              "MonthlyIncome": 9120.0,
              "NumberOfOpenCreditLinesAndLoans": 13,
              "NumberOfTimes90DaysLate": 0,
              "NumberRealEstateLoansOrLines": 6,
              "NumberOfTime60_89DaysPastDueNotWorse": 0,
              "NumberOfDependents": 2
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Smoke test prediction failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Automated Staging Rollback on Failure
        if: failure()
        run: |
          echo "⚠️ Staging deployment / smoke test failed. Initiating automatic rollback..."
          docker compose down
          echo "✅ Staging environment rolled back safely"

      - name: Tear Down Staging
        if: always()
        run: |
          docker compose down

  # ============================================================
  # Stage 7: Production Promotion Gate
  # ============================================================
  production-promotion:
    name: 7. Production Promotion Gate
    runs-on: ubuntu-latest
    needs: staging-deployment
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.production.internal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Announce Production Release
        run: |
          echo "🚀 Staging health and smoke tests passed successfully."
          echo "Deploying immutable release ${{ github.sha }} to Production..."
          echo "Model governance: Models are independently evaluated via EvaluationGate before promotion."

      - name: Production Post-Deploy Verification
        run: |
          echo "Verifying Production endpoints..."
          echo "Production deployment and gate validation confirmed."
