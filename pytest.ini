[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    unit: Unit tests (isolated, mocked external services)
    integration: Integration tests (multi-component or API integration)
    regression: Regression tests for fixed P0/P1 bugs
    e2e: End-to-end workflow tests
    slow: Slow running tests
    timeout: Mark test with timeout in seconds
