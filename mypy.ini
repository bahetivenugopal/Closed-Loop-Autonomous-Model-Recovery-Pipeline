[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
follow_imports = silent
implicit_optional = True
disable_error_code = attr-defined

[mypy-tests.*]
ignore_errors = True

[mypy-mlflow.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-evidently.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-pandera.*]
ignore_missing_imports = True
ignore_errors = True
